name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Keep APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeLife-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FreeLife.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FreeLife.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "最新版 (build ${{ github.run_number }})" \
            --notes "自動編譯,commit ${{ github.sha }}"
