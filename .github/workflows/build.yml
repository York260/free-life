name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          set -o pipefail
          if ! gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log; then
            # 把編譯錯誤變成註記,方便遠端讀取
            grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      - name: Keep APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeLife-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "最新版 (build ${{ github.run_number }})"
          NOTES: "自動編譯,commit ${{ github.sha }}"
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FreeLife.apk
          # 每一版用不同檔名,避免手機瀏覽器拿到舊的(已失效的)下載轉址
          APK="FreeLife-${{ github.run_number }}.apk"
          cp FreeLife.apk "$APK"
          APKB=""
          # 清掉之前卡住的草稿(GitHub 偶爾會把發佈變成 untagged 草稿)
          for id in $(gh api repos/${{ github.repository }}/releases -q '.[] | select(.draft) | .id'); do
            gh api -X DELETE repos/${{ github.repository }}/releases/$id || true
          done
          # 把 latest 標籤移到這次的 commit(不刪掉發佈,避免變成草稿)
          git tag -f latest "${{ github.sha }}"
          git push -f origin refs/tags/latest
          if gh api repos/${{ github.repository }}/releases/tags/latest > /dev/null 2>&1; then
            # 先清掉舊版本的 APK,只留這一版
            for a in $(gh api repos/${{ github.repository }}/releases/tags/latest -q '.assets[].id'); do
              gh api -X DELETE repos/${{ github.repository }}/releases/assets/$a || true
            done
            gh release upload latest "$APK" $APKB --clobber
            gh release edit latest --title "$TITLE" --notes "$NOTES" --prerelease --draft=false
          else
            gh release create latest "$APK" $APKB --target "${{ github.sha }}" --prerelease --title "$TITLE" --notes "$NOTES"
          fi
          # 最後確認真的公開了
          for i in 1 2 3 4 5; do
            d=$(gh api repos/${{ github.repository }}/releases/tags/latest -q .draft 2>/dev/null || echo missing)
            [ "$d" = "false" ] && { echo "published"; exit 0; }
            sleep 5
            gh release edit latest --draft=false || true
          done
          echo "release still not published" && exit 1

  # 在雲端 Android 模擬器上自動跑「語音自動測試」和一次真的鬧鐘,結果變成註記方便遠端讀取
  probe:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FreeLife-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run voice probe on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -no-snapshot
          script: |
            adb install -r app-debug.apk
            adb shell pm list packages | grep -i tts || true
            adb shell settings get secure tts_default_synth || true
            adb logcat -c
            adb shell am start -n com.freelife.app/.MainActivity --ez probe true
            sleep 100
            adb logcat -d -v raw -s FreeLifeProbe:I > probe.log || true
            adb shell am force-stop com.freelife.app
            adb logcat -c
            adb shell am start -n com.freelife.app/.MainActivity --ez probeAlarm true
            sleep 5
            adb shell input keyevent KEYCODE_HOME
            sleep 40
            adb logcat -d -v raw -s FreeLifeProbe:I > alarm.log || true
            adb shell am force-stop com.freelife.app
            adb logcat -c
            adb shell am start -n com.freelife.app/.MainActivity --ez probeAlarm true
            sleep 5
            adb shell input keyevent KEYCODE_HOME
            sleep 40
            adb logcat -d -v raw -s FreeLifeProbe:I > alarm2.log || true
            adb logcat -d -v brief AndroidRuntime:E '*:S' > crash.log || true

      - name: Report
        if: always()
        run: |
          for f in probe.log alarm.log alarm2.log crash.log; do
            echo "== $f"; cat $f 2>/dev/null || true
            msg=$(cat $f 2>/dev/null | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=$f::${msg:-empty}"
          done
