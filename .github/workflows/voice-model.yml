name: Prepare voice model

# 下載 sherpa-onnx 與 Kokoro 中文模型,檢查內容,重新打包成 zip 放到 voice-models 發佈,手機從這裡下載
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/voice-model.yml"]

permissions:
  contents: write

env:
  SHERPA_VER: "1.12.15"
  MODEL: "kokoro-int8-multi-lang-v1_1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download
        run: |
          curl -sSL -o sherpa.aar "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VER}/sherpa-onnx-${SHERPA_VER}.aar"
          curl -sSL -o model.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/${MODEL}.tar.bz2"
          ls -l sherpa.aar model.tar.bz2
          tar xjf model.tar.bz2

      - name: Inspect API
        run: |
          mkdir aar && cd aar && unzip -q ../sherpa.aar
          echo start > ../api.txt
          mkdir cls && cd cls && unzip -q ../classes.jar
          for c in OfflineTts OfflineTtsConfig OfflineTtsModelConfig OfflineTtsKokoroModelConfig GeneratedAudio; do
            f=$(find . -name "$c.class" | head -1)
            if [ -n "$f" ]; then echo "## $c" >> ../../api.txt; javap -cp . "${f#./}" 2>&1 | grep -E " get[A-Z]|\($|public com.k2fsa.sherpa.onnx.$c\(|GeneratedAudio\(|getSamples|save" | grep -v Default | sed "s|com.k2fsa.sherpa.onnx.||g; s|java.lang.||g; s|public final ||" >> ../../api.txt; else echo "missing $c" >> ../../api.txt; fi
          done
          cd ../..
          ls aar/jni/arm64-v8a >> api.txt
          cat api.txt
          msg=$(head -c 12000 api.txt | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=api.txt::$msg"

      - name: Classify voices (male / female)
        run: |
          pip install -q sherpa-onnx numpy
          python3 .github/scripts/voices.py "$MODEL" | tee voices.txt
          msg=$(sed 's/%/%25/g' voices.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=voices.txt::$msg"

      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view voice-models --json assets -q '.assets[].name' 2>/dev/null | grep -q kokoro-zh.zip; then echo "already published"; exit 0; fi
          (cd "$MODEL" && zip -qr ../kokoro-zh.zip . -x "LICENSE" -x "*.md")
          ls -l kokoro-zh.zip
          echo "::notice title=zip::$(stat -c %s kokoro-zh.zip) bytes"
          if ! gh release view voice-models > /dev/null 2>&1; then
            gh release create voice-models --title "語音模型" --notes "Kokoro 中文語音模型(sherpa-onnx ${SHERPA_VER} 用)" --prerelease
          fi
          gh release upload voice-models kokoro-zh.zip sherpa.aar --clobber
